# ─── AgroPulse Backend — Configuración principal ───────────────────────────
# Archivo: src/main/resources/application.properties
# Descripción: Configuración de la aplicación Spring Boot

# ── Servidor ────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── Base de datos (SQLite para desarrollo local) ────────────────────────────
spring.datasource.url=jdbc:sqlite:agropulse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── CORS (permite peticiones del frontend en Vercel) ────────────────────────
agropulse.cors.allowed-origins=http://localhost:5173,https://agropulse.vercel.app

# ── Seguridad ───────────────────────────────────────────────────────────────
agropulse.security.jwt-secret=agropulse-secret-key-2024-production
agropulse.security.jwt-expiration-ms=86400000

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.agropulse=INFO
logging.level.org.springframework=WARN
