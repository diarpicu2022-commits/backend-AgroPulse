# ─── AgroPulse Backend — Configuración principal ───────────────────────────
# Archivo: src/main/resources/application.properties
# Descripción: Configuración de la aplicación Spring Boot

# ── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── Base de datos (SQLite para desarrollo local) ────────────────────────────
spring.datasource.url=jdbc:sqlite:agropulse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── CORS — set CORS_ALLOWED_ORIGINS in Render environment variables ─────────
agropulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# ── Seguridad — set JWT_SECRET in Render environment variables ──────────────
agropulse.security.jwt-secret=${JWT_SECRET:agropulse-default-secret-change-in-production}
agropulse.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.agropulse=INFO
logging.level.org.springframework=WARN
