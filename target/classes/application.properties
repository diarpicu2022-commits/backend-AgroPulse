# ─── AgroPulse Backend — Configuración principal ───────────────────────────
# Archivo: src/main/resources/application.properties
# Descripción: Configuración de la aplicación Spring Boot

# ── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── Base de datos ───────────────────────────────────────────────────────────
# Local (default): SQLite
# Producción (Render): set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_DRIVER_CLASS_NAME,
#   SPRING_JPA_DATABASE_PLATFORM en las variables de entorno de Render.
# Ejemplo PostgreSQL/Supabase:
#   SPRING_DATASOURCE_URL      = jdbc:postgresql://db.xxx.supabase.co:5432/postgres?user=postgres&password=XXX&sslmode=require
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME = org.postgresql.Driver
#   SPRING_JPA_DATABASE_PLATFORM        = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:agropulse.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── CORS — set CORS_ALLOWED_ORIGINS in Render environment variables ─────────
agropulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# ── Seguridad — set JWT_SECRET in Render environment variables ──────────────
agropulse.security.jwt-secret=${JWT_SECRET:agropulse-default-secret-change-in-production}
agropulse.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.agropulse=INFO
logging.level.org.springframework=WARN

# ── PostgreSQL: disable server-side prepared statement caching ────────────────
# Fixes "prepared statement S_XX already exists" with HikariCP on Supabase/PgBouncer
spring.datasource.hikari.data-source-properties.prepareThreshold=0
